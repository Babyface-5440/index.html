<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-scale=1.0" />
<title>Admin Portal | Al-Amannah International Academy</title>
<style>
  :root {
    --primary: #002b80;
    --accent: #d4af37;
    --bg: #f5f7fb;
    --text: #222;
    --card-bg: #ffffff;
  }

  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  /* Watermark background */
  body::before {
    content: "";
    background: url('Al-Amannah-logo.png') center center no-repeat;
    background-size: 300px;
    opacity: 0.05;
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .login-container, .dashboard {
    background: var(--card-bg);
    padding: 2rem;
    border-radius: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    text-align: center;
    width: 90%;
    max-width: 400px;
    position: relative;
    z-index: 1;
  }

  .login-container h2 {
    color: var(--primary);
    margin-bottom: 1.5rem;
  }

  .login-container input {
    width: 100%;
    padding: 0.8rem;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-size: 1rem;
  }

  .login-container button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 0.8rem 1.2rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
  }

  .login-container button:hover {
    background: var(--accent);
    color: var(--primary);
  }

  /* Dashboard */
  .dashboard {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 90%;
    max-width: 800px;
    text-align: center;
  }

  .dashboard h1 {
    color: var(--primary);
    margin-bottom: 1rem;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1.5rem;
    width: 100%;
    margin-top: 1rem;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    transition: transform 0.3s;
  }

  .card:hover {
    transform: translateY(-5px);
  }

  .card i {
    font-size: 2rem;
    color: var(--accent);
    margin-bottom: 0.8rem;
  }

  .card h3 {
    color: var(--primary);
    margin-bottom: 0.5rem;
  }

  .buttons {
    margin-top: 2rem;
  }

  .buttons button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 0.8rem 1.5rem;
    border-radius: 8px;
    cursor: pointer;
    margin: 0 0.5rem;
    font-weight: 600;
    transition: 0.3s;
  }

  .buttons button:hover {
    background: var(--accent);
    color: var(--primary);
  }

  @media (max-width: 600px) {
    .cards {
      grid-template-columns: 1fr;
    }
  }
</style>
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="login-container" id="loginBox">
  <h2>Admin Portal Login</h2>
  <input type="password" id="password" placeholder="Enter Password" />
  <button onclick="login()">Login</button>
</div>

<div class="dashboard" id="dashboard">
  <h1>Welcome, Admin</h1>
  <p>Manage Al-Amannah International Academy portal below.</p>

  <div class="cards">
    <div class="card">
      <i class="fas fa-user-graduate"></i>
      <h3>Admissions</h3>
      <p>View and manage student applications.</p>
    </div>
    <div class="card">
      <i class="fas fa-file-alt"></i>
      <h3>Results</h3>
      <p>Upload and check student performance reports.</p>
    </div>
    <div class="card">
      <i class="fas fa-credit-card"></i>
      <h3>Fee Summary</h3>
      <p>Monitor school payment records and balances.</p>
    </div>
  </div>

  <div class="buttons">
    <button onclick="goBack()">Back to Website</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<script>
function login() {
  const pass = document.getElementById("password").value;
  if (pass === "5440") {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "flex";
    document.body.style.justifyContent = "flex-start";
    document.body.style.alignItems = "flex-start";
    document.body.style.padding = "2rem";
  } else {
    alert("Incorrect password! Please try again.");
  }
}

function logout() {
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginBox").style.display = "block";
  document.getElementById("password").value = "";
  document.body.style.justifyContent = "center";
  document.body.style.alignItems = "center";
  document.body.style.padding = "0";
}

function goBack() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
