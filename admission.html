<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admission Application - Al-Amannah International Academy</title>
<style>
  body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background-color: #f6f9ff;
    color: #222;
  }
  header {
    background-color: #002b80;
    color: white;
    display: flex;
    align-items: center;
    padding: 0.8rem 1.5rem;
  }
  header img {
    height: 60px;
    width: 60px;
    border-radius: 50%;
    margin-right: 10px;
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
  }
  .container {
    background-color: white;
    max-width: 700px;
    margin: 2rem auto;
    padding: 2rem;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  h2 {
    color: #002b80;
    text-align: center;
  }
  form label {
    display: block;
    margin-top: 1rem;
    font-weight: 600;
  }
  form input, form select, form textarea {
    width: 100%;
    padding: 0.7rem;
    margin-top: 0.4rem;
    border: 1px solid #ccc;
    border-radius: 5px;
  }
  button {
    background-color: #002b80;
    color: white;
    border: none;
    padding: 0.8rem 1.4rem;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 1.2rem;
  }
  button:hover {
    background-color: #001f5c;
  }
  footer {
    background-color: #002b80;
    color: white;
    text-align: center;
    padding: 1rem;
  }
</style>
</head>
<body>

<header>
  <img src="Al-Amannah-logo.png" alt="School Logo">
  <h1>Al-Amannah International Academy</h1>
</header>

<div class="container">
  <h2>Admission Application Form</h2>
  <p>Please fill in the form below carefully and ensure all details are correct.</p>

  <form action="mailto:alaselataiye@gmail.com" method="post" enctype="text/plain">
    <label>Student's Full Name</label>
    <input type="text" name="Full Name" required>

    <label>Date of Birth</label>
    <input type="date" name="Date of Birth" required>

    <label>Gender</label>
    <select name="Gender" required>
      <option value="">Select Gender</option>
      <option>Male</option>
      <option>Female</option>
    </select>

    <label>Address</label>
    <textarea name="Address" rows="3" required></textarea>

    <label>Parent/Guardian's Name</label>
    <input type="text" name="Parent Name" required>

    <label>Parent/Guardian's Phone Number</label>
    <input type="tel" name="Parent Phone" placeholder="e.g. 08123456789" required>

    <label>Email Address (optional)</label>
    <input type="email" name="Email">

    <label>Class Applying For</label>
    <select name="Class Applying For" required>
      <option value="">Select Class</option>
      <option>Nursery</option>
      <option>Primary 1 - 6</option>
      <option>JSS 1 - 3</option>
      <option>SSS 1 - 3</option>
    </select>

    <label>Previous School Attended (if any)</label>
    <input type="text" name="Previous School">

    <label>Upload Passport Photograph</label>
    <input type="file" name="Passport" accept="image/*">

    <button type="submit">Submit Application</button>
  </form>
</div>

<footer>
  &copy; 2025 Al-Amannah International Academy — Ilorin, Kwara State
</footer>

</body>
</html>
